  <meta name="apple-mobile-web-app-title" content="東京行">

  <!-- Tailwind CSS & Leaflet -->

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    /* 強制給予明確高度，確保地圖百分之百能渲染出來不消失 */
    #map { 
      height: 40vh; 
      min-height: 260px;
      width: 100%; 
      z-index: 10; 
      background-color: #e5e7eb;
    }
    .scroll-touch { -webkit-overflow-scrolling: touch; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-100 flex flex-col h-screen overflow-hidden text-slate-800 select-none">

  <!-- 頂部導航欄 -->

      <div class="flex items-center gap-1.5">
        <span class="text-base">🇯🇵</span>
        <span class="font-bold text-xs tracking-wider" id="header-title">東京自由行導航</span>
      </div>
      
      <!-- 右上角：日幣自動換算小工具按鈕 -->
      <button onclick="toggleCalcModal()" class="flex items-center gap-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-2.5 py-1 rounded-full text-xs shadow transition">
        <span>💴 算匯率</span>
      </button>
    </div>

    <!-- 日期切換 Tab -->
    <div class="flex overflow-x-auto scroll-touch p-2 gap-1.5 text-xs font-semibold no-scrollbar" id="day-tabs">
      <button onclick="switchDay('day0')" id="tab-day0" class="tab-btn shrink-0 px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">D0 10/8</button>
      <button onclick="switchDay('day1')" id="tab-day1" class="tab-btn shrink-0 px-3 py-1 rounded-full bg-blue-600 text-white font-bold shadow">D1 上野/秋葉原</button>
      <button onclick="switchDay('day2')" id="tab-day2" class="tab-btn shrink-0 px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">D2 淺草/晴空塔</button>
      <button onclick="switchDay('day3')" id="tab-day3" class="tab-btn shrink-0 px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">D3 神宮/SHIBUYA</button>
      <button onclick="switchDay('day4')" id="tab-day4" class="tab-btn shrink-0 px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700">D4 多慶屋/返台</button>
    </div>
  </header>

  <!-- 上半部：穩定圖資地圖（含順向連線） -->
  <div id="map"></div>

  <!-- 下半部：滾動行程卡片與採買清單 -->

    <!-- 今日核心概覽 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200">
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-blue-600 font-bold uppercase" id="day-date"></span>
        <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">票券：72hr地鐵券 / Skyliner</span>
      </div>
      <h2 class="text-sm font-bold text-slate-900 mt-0.5" id="day-title"></h2>
    </div>

    <!-- 行程景點清單 -->
    <div class="space-y-2.5" id="spots-list"></div>

    <!-- 購物清單區塊 -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200" id="shopping-card">
      <h3 class="text-xs font-bold text-slate-700 uppercase tracking-wider mb-2 flex items-center gap-1.5">
        <span>🛍️</span> 本日推薦必買 & 退稅注意事項
      </h3>
      <div class="space-y-2 text-xs" id="shopping-list"></div>
    </div>
  </main>

  <!-- 彈出式：日幣/台幣自動換算機 Modal -->
  <div id="calc-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-4 w-full max-w-xs shadow-2xl border border-slate-200 space-y-3">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-1">
          <span>💴</span> 日幣換算台幣
        </h3>
        <button onclick="toggleCalcModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg leading-none">✕</button>
      </div>
      
      <!-- 輸入框 -->
      <div class="space-y-2">
        <div>
          <label class="text-[11px] font-bold text-slate-500">輸入日圓金額 (JPY)：</label>
          <div class="relative mt-1">
            <input type="number" id="calc-jpy" placeholder="例如: 5500" oninput="calculateExchange()"
                   class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-base font-bold text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500">
            <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-bold">円</span>
          </div>
        </div>

        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center">
          <div class="text-[11px] text-amber-800 font-bold">折合新台幣約：</div>
          <div class="text-2xl font-black text-amber-600 font-mono mt-0.5" id="calc-twd">NT$ 0</div>
          <div class="text-[10px] text-amber-700 mt-1" id="tax-alert"></div>
        </div>
      </div>

      <!-- 匯率自訂 -->
      <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1 border-t">
        <span>當前匯率: 1 JPY = </span>
        <div class="flex items-center gap-1">
          <input type="number" step="0.001" id="custom-rate" value="0.21" oninput="calculateExchange()"
                 class="w-12 bg-slate-100 border text-center rounded px-1 py-0.5 text-slate-700 font-bold">
          <span>TWD</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 匯率計算
    function toggleCalcModal() {
      const modal = document.getElementById('calc-modal');
      modal.classList.toggle('hidden');
      if (!modal.classList.contains('hidden')) {
        document.getElementById('calc-jpy').focus();
      }
    }

    function calculateExchange() {
      const jpy = parseFloat(document.getElementById('calc-jpy').value) || 0;
      const rate = parseFloat(document.getElementById('custom-rate').value) || 0.21;
      const twd = Math.round(jpy * rate);
      document.getElementById('calc-twd').innerText = `NT$ ${twd.toLocaleString()}`;

      const taxAlert = document.getElementById('tax-alert');
      if (jpy >= 5000) {
        taxAlert.innerHTML = `🎉 已達 <b>${jpy.toLocaleString()} 円</b>（滿5,000円出示護照正本可免稅 10%）`;
        taxAlert.className = "text-[10px] text-emerald-700 font-bold mt-1";
      } else {
        const remain = 5000 - jpy;
        taxAlert.innerHTML = `差 ${remain.toLocaleString()} 円可達退稅門檻 (5,000円)`;
        taxAlert.className = "text-[10px] text-slate-500 mt-1";
      }
    }

            transit: "從 APA 步行 7 分鐘抵達",
            actionTip: "買完提戰利品回飯店拿大行李，11:45 走到京成上野站。"
          },
          {
            name: "京成上野站 (Skyliner)",
            nameJp: "京成上野駅 (けいせいうえの)",
            lat: 35.7118,
            lng: 139.7741,
            time: "11:50 - 12:00",
            stay: "搭車",
            stepTip: "在藍色機台或人工售票處劃位，搭乘 12:00 Skyliner（12:42 抵達第二航廈，起飛前 2.5 小時最安全）！",
            transit: "回飯店取行李後步行 5 分鐘抵達車站",
            actionTip: "在車上放鬆休息 41 分鐘，準備抵達機場。"
          },
          {
            name: "成田機場 第二航廈 3F 出發大廳",
            nameJp: "成田空港第2ターミナル 3F",
            lat: 35.7730,
            lng: 140.3878,
            time: "12:45 - 15:20",
            stay: "登機手續",
            stepTip: "【出境 5 步 SOP】\n1. 機場第2大樓站 B1 搭手扶梯直上 3F 大廳。\n2. 看電視牆星宇 JX803 櫃檯（常為 Q/R）出示護照託運行李（看螢幕過 X 光再走）。\n3. 過中央安檢（平板/行動電源放籃子、液體瓶全裝透明夾鏈袋）。\n4. 海關機台刷護照核對退稅 ➡️ 臉部辨識自動通關。\n5. 管制區 Fa-So-La 免稅店買伴手禮 ➡️ 14:50 登機門登機！",
            transit: "出閘門手扶梯直達 3 樓出發大廳",
            actionTip: "星宇 JX803 (15:20 - 18:00) 滿載戰利品返抵桃園第一航廈。"
          }
        ],
        shopping: [
          { name: "合利他命 EX Plus 270錠", jpy: 5980, note: "多慶屋 2F 藥妝，滿 5,000 円出示護照免稅" },
          { name: "大正百保能感冒微粒 / EVE 止痛藥", jpy: 2600, note: "家庭必備常備藥" },
          { name: "白色戀人 / Royce 生巧克力", jpy: 3200, note: "成田 T2 管制區 Fa-So-La 免稅店直購免稅" }
        ]
      }
    };

    // 初始化地圖：使用全平台最穩定的官方圖資
    let map = L.map('map', { zoomControl: false }).setView([35.7118, 139.7741], 14);
    
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markersLayer = L.featureGroup().addTo(map);
    let routePolyline = null;

    function switchDay(dayKey) {
      // Tab 樣式切換
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn shrink-0 px-3 py-1 rounded-full bg-slate-800 text-slate-400 border border-slate-700 font-semibold";
      });
      const activeBtn = document.getElementById(`tab-${dayKey}`);
      if (activeBtn) {
        activeBtn.className = "tab-btn shrink-0 px-3 py-1 rounded-full bg-blue-600 text-white font-bold shadow";
      }

      const data = travelData[dayKey];
      document.getElementById('day-date').innerText = data.date;
      document.getElementById('day-title').innerText = data.title;
      document.getElementById('header-title').innerText = `東京行・${data.title.split('・')[0]}`;

      // 清除舊圖釘與路徑連線
      markersLayer.clearLayers();
      if (routePolyline) map.removeLayer(routePolyline);

      const spotsListEl = document.getElementById('spots-list');
      spotsListEl.innerHTML = '';
      const latlngs = [];

      data.spots.forEach((spot, idx) => {
        latlngs.push([spot.lat, spot.lng]);

        // 自訂醒目號碼標記
        const customIcon = L.divIcon({
          className: 'custom-pin',
          html: `<div style="background:#2563EB;color:white;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border:2px solid white;box-shadow:0 3px 6px rgba(0,0,0,0.4);">${idx + 1}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon }).addTo(markersLayer);
        const popupContent = `
          <div style="font-size:12px;min-width:180px;">
            <b style="color:#1D4ED8;font-size:13px;">${idx + 1}. ${spot.name}</b><br>
            <span style="color:#64748B;font-family:monospace;">${spot.nameJp}</span>
            <div style="margin-top:4px;font-weight:bold;color:#0F172A;">⏱️ 停留：${spot.stay}</div>
            <a href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}" 
               target="_blank" 
               style="display:block;background:#2563EB;color:white;text-align:center;padding:5px 0;border-radius:6px;margin-top:6px;text-decoration:none;font-weight:bold;">
               📍 Google Maps 導航
            </a>
          </div>
        `;
        marker.bindPopup(popupContent);

        // 下方行程卡片
        const card = document.createElement('div');
        card.className = "bg-white p-3 rounded-xl border border-slate-200 shadow-sm cursor-pointer active:scale-[0.99] transition";
        card.onclick = () => {
          map.panTo([spot.lat, spot.lng]);
          marker.openPopup();
        };
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[11px] bg-blue-50 text-blue-700 font-bold px-2 py-0.5 rounded border border-blue-100">${spot.time}</span>
            <span class="text-[11px] text-slate-400 font-medium">預計待 ${spot.stay}</span>
          </div>
          <div class="mt-1 font-bold text-slate-900 text-sm">${idx + 1}. ${spot.name}</div>
          <div class="text-[11px] text-slate-400 font-mono">${spot.nameJp}</div>

          <!-- 重要操作 SOP 與轉乘提示 -->
          <div class="mt-2 text-xs space-y-1.5">
            <div class="bg-amber-50 border border-amber-200 text-amber-900 p-2 rounded-lg leading-relaxed">
              <span class="font-bold">⚠️ 操作SOP：</span>${spot.stepTip.replace(/\n/g, '<br>')}
            </div>
            <div class="bg-slate-50 border border-slate-100 text-slate-600 p-2 rounded-lg">
              <div>🚇 <b>交通：</b>${spot.transit}</div>
              <div class="text-blue-700 mt-0.5">💡 <b>推薦：</b>${spot.actionTip}</div>
            </div>
          </div>

          <div class="mt-2 flex justify-end">
            <a href="https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}" 
               target="_blank" 
               onclick="event.stopPropagation();"
               class="inline-flex items-center gap-1 text-[11px] font-bold bg-blue-600 text-white px-3 py-1.5 rounded-lg shadow hover:bg-blue-700">
               <span>📍</span> 開啟 Google Maps 路線導航
            </a>
          </div>
        `;
        spotsListEl.appendChild(card);
      });

      // 畫出點跟點之間的導航連線
      if (latlngs.length > 1) {
        routePolyline = L.polyline(latlngs, {
          color: '#2563EB',
          weight: 4,
          opacity: 0.85,
          dashArray: '6, 8',
          lineCap: 'round'
        }).addTo(map);
      }

      if (latlngs.length > 0) {
        map.fitBounds(markersLayer.getBounds(), { padding: [35, 35] });
      }

      // 核心修正：強制重新計算地圖尺寸，避免地圖變灰或消失
      setTimeout(() => {
        map.invalidateSize();
      }, 100);

      // 採買清單渲染
      const shopCard = document.getElementById('shopping-card');
      const shopEl = document.getElementById('shopping-list');
      shopEl.innerHTML = '';

      if (data.shopping.length === 0) {
        shopCard.classList.add('hidden');
      } else {
        shopCard.classList.remove('hidden');
        data.shopping.forEach(item => {
          const twd = Math.round(item.jpy * 0.21);
          const isTaxFree = item.jpy >= 5000;
          const row = document.createElement('div');
          row.className = "p-2.5 bg-slate-50 rounded-lg border border-slate-200 flex flex-col gap-1";
          row.innerHTML = `
            <div class="flex justify-between items-center font-bold">
              <span class="text-slate-800 text-xs">${item.name}</span>
              <span class="text-emerald-700 font-mono text-xs">約 NT$ ${twd.toLocaleString()} <span class="text-slate-400 font-normal">(${item.jpy.toLocaleString()}円)</span></span>
            </div>
            <div class="flex justify-between items-center text-slate-500 text-[11px]">
              <span>💡 ${item.note}</span>
              ${isTaxFree ? '<span class="bg-red-50 text-red-600 border border-red-200 px-1.5 py-0.2 rounded text-[10px] font-bold">滿額免稅</span>' : ''}
            </div>
          `;
          shopEl.appendChild(row);
        });
      }
    }

    // 頁面載入完成後初始化
    window.addEventListener('load', () => {
      switchDay('day1');
      setTimeout(() => map.invalidateSize(), 300);
    });
  </script>
</body>
</html>
