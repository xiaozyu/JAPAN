<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東京自由行導航</title>
  
  <!-- PWA 設定（可加到手機主畫面當 App） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="東京行">
  <meta name="theme-color" content="#1e293b">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    #map-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    iframe { width: 100%; height: 100%; border: 0; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 flex flex-col h-full select-none">

  <!-- 頂部浮動切換欄 -->
  <header class="absolute top-0 left-0 right-0 z-30 p-2 pointer-events-none">
    <div class="max-w-md mx-auto pointer-events-auto">
      <!-- 頂部標題與匯率 -->
      <div class="bg-slate-900/90 backdrop-blur-md text-white px-3 py-1.5 rounded-xl shadow-lg flex justify-between items-center border border-slate-700/50 mb-1.5">
        <div class="flex items-center gap-1.5">
          <span class="text-base">🇯🇵</span>
          <span class="font-bold text-xs tracking-wider" id="day-title">Day 1 上野・秋葉原</span>
        </div>
        <span class="text-[10px] bg-slate-800 border border-slate-600 px-2 py-0.5 rounded-full text-slate-300">匯率 JPY×0.21</span>
      </div>

      <!-- 日期滑動切換按鈕 -->
      <div class="flex gap-1.5 overflow-x-auto no-scrollbar py-0.5">
        <button onclick="switchDay('day0')" id="btn-day0" class="tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-slate-800/90 text-slate-300 shadow border border-slate-700">D0 10/8</button>
        <button onclick="switchDay('day1')" id="btn-day1" class="tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-blue-600 text-white shadow">D1 10/9</button>
        <button onclick="switchDay('day2')" id="btn-day2" class="tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-slate-800/90 text-slate-300 shadow border border-slate-700">D2 10/10</button>
        <button onclick="switchDay('day3')" id="btn-day3" class="tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-slate-800/90 text-slate-300 shadow border border-slate-700">D3 10/11</button>
        <button onclick="switchDay('day4')" id="btn-day4" class="tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-slate-800/90 text-slate-300 shadow border border-slate-700">D4 10/12</button>
      </div>
    </div>
  </header>

  <!-- 中間：滿版原生 Google 地圖 -->
  <div id="map-container">
    <iframe id="gmap-iframe" src="" allowfullscreen loading="lazy"></iframe>
  </div>

  <!-- 下方：可收合行程小卡抽屜 -->
  <div class="absolute bottom-0 left-0 right-0 z-30 pointer-events-none p-3 pb-safe">
    <div class="max-w-md mx-auto pointer-events-auto bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl border border-gray-200/80 overflow-hidden transition-all duration-300" id="card-drawer">
      
      <!-- 拖曳收合把手 / 標題列 -->
      <div class="px-4 py-2 bg-slate-50 border-b border-gray-200 flex justify-between items-center cursor-pointer" onclick="toggleDrawer()">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse"></span>
          <span class="text-xs font-bold text-gray-700" id="drawer-status">點此切換行程列表（今日 5 個點）</span>
        </div>
        <span class="text-xs text-gray-400 font-bold" id="drawer-arrow">▲ 展開</span>
      </div>

      <!-- 滾動行程內容（預設收納高度 170px，展開可全看） -->
      <div class="p-3 overflow-y-auto max-h-[38vh] space-y-2 text-xs" id="spots-list">
        <!-- JS 動態生成 -->
      </div>
    </div>
  </div>

  <script>

          }
        ]
      },
      day4: {
        title: "D4 10/12 多慶屋・成田 T2 SOP 返台",
        centerQ: "多慶屋 TAKEYA 1",
        spots: [
          {
            time: "10:00 - 11:20",
            name: "多慶屋 TAKEYA 1",
            nameJp: "多慶屋 (たけや 1)",
            stay: "1.2小時",
            transit: "09:30 退房寄行李，走 7 分鐘抵達",
            tip: "10:00 2F/3F 準時開門掃藥妝零食，出示護照退稅",
            q: "多慶屋 TAKEYA 1"
          },
          {
            time: "11:50 - 12:00",
            name: "京成上野站 (Skyliner)",

            tip: "JX803 櫃檯託運（看過X光） ➡️ 安檢 ➡️ 刷護照 ➡️ Fa-So-La 免稅店買白色戀人 ➡️ 14:50 登機",

          }
        ]
      }
    };

    let isExpanded = false;

    // 切換抽屜收合
    function toggleDrawer() {
      const drawer = document.getElementById('card-drawer');
      const arrow = document.getElementById('drawer-arrow');
      isExpanded = !isExpanded;
      if (isExpanded) {
        drawer.querySelector('#spots-list').classList.remove('max-h-[38vh]');
        drawer.querySelector('#spots-list').classList.add('max-h-[65vh]');
        arrow.innerText = '▼ 收合';
      } else {
        drawer.querySelector('#spots-list').classList.remove('max-h-[65vh]');
        drawer.querySelector('#spots-list').classList.add('max-h-[38vh]');
        arrow.innerText = '▲ 展開';
      }
    }

    // 更新地圖視角
    function focusMap(query) {
      const iframe = document.getElementById('gmap-iframe');
      // 使用 Google Maps 官方標準內嵌網址（原生、無雜訊、完全免費）
      iframe.src = `https://maps.google.com/maps?q=${encodeURIComponent(query)}&t=&z=15&ie=UTF8&iwloc=&output=embed`;
    }

    // 切換日期
    function switchDay(dayKey) {
      // Tab 樣式切換
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = "tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-slate-800/90 text-slate-300 shadow border border-slate-700";
      });
      const currentBtn = document.getElementById(`btn-${dayKey}`);
      if (currentBtn) {
        currentBtn.className = "tab-btn shrink-0 text-xs px-3 py-1 rounded-full font-bold bg-blue-600 text-white shadow";
      }

      const data = itinerary[dayKey];
      document.getElementById('day-title').innerText = data.title;
      document.getElementById('drawer-status').innerText = `${data.title}（共 ${data.spots.length} 個點）`;

      // 切換地圖中心
      focusMap(data.centerQ);

      // 渲染列表
      const listEl = document.getElementById('spots-list');
      listEl.innerHTML = '';

      data.spots.forEach((spot, idx) => {
        const card = document.createElement('div');
        card.className = "p-2.5 bg-gray-50 hover:bg-blue-50/60 rounded-xl border border-gray-200 transition flex flex-col gap-1 cursor-pointer";
        card.onclick = () => focusMap(spot.q);

        card.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded">${spot.time}</span>
            <span class="text-[10px] text-gray-400">停留 ${spot.stay}</span>
          </div>
          <div class="font-bold text-gray-900 text-sm mt-0.5">${idx + 1}. ${spot.name}</div>
          <div class="text-[11px] text-gray-400 font-mono">${spot.nameJp}</div>
          <div class="text-[11px] text-gray-600 mt-1 bg-white p-1.5 rounded border border-gray-100">
            <div>🚇 <b>交通：</b>${spot.transit}</div>
            <div class="text-amber-800 mt-0.5">💡 <b>備註：</b>${spot.tip}</div>
          </div>
          <div class="flex gap-2 mt-1">
            <button onclick="event.stopPropagation(); focusMap('${spot.q}')" class="flex-1 py-1 bg-slate-100 text-slate-700 rounded font-semibold text-[11px] hover:bg-slate-200 text-center">
              在地圖查看
            </button>
            <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(spot.q)}" target="_blank" onclick="event.stopPropagation();" class="flex-1 py-1 bg-blue-600 text-white rounded font-semibold text-[11px] hover:bg-blue-700 text-center">
              📍 App 導航
            </a>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    // 預設載入 Day 1
    window.onload = () => switchDay('day1');
  </script>
</body>
</html>
